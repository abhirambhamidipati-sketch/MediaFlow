<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon mark: rounded square -->
  <rect x="0" y="4" width="40" height="40" rx="10" fill="url(#iconGrad)"/>

  <!-- M letterform inside icon -->
  <path d="M9 32 L9 16 L20 28 L31 16 L31 32" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- Camera aperture dots (bottom row) — subtle lens motif -->
  <circle cx="14" cy="36" r="1.4" fill="rgba(255,255,255,0.55)"/>
  <circle cx="20" cy="36" r="1.4" fill="rgba(255,255,255,0.85)"/>
  <circle cx="26" cy="36" r="1.4" fill="rgba(255,255,255,0.55)"/>

  <!-- Wordmark: "Media" -->
  <text x="50" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="19" font-weight="700" letter-spacing="-0.5" fill="white" opacity="0.92">Media</text>
  <!-- Wordmark: "Flow" in blue -->
  <text x="107" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="19" font-weight="700" letter-spacing="-0.5" fill="url(#glowGrad)">Flow</text>
</svg>
