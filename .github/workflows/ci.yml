name: Django DevSecOps CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-secure:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Setup Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Run Django migrations
    - name: Run migrations
      env:
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
      run: |
        python manage.py makemigrations
        python manage.py migrate

    # 5. Run Django tests
    - name: Run tests
      env:
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
      run: |
        python manage.py test

    # =========================
    # 🔐 DEVSECOPS PART STARTS
    # =========================

    # 6. Install security tools
    - name: Install security tools
      run: |
        pip install bandit safety flake8

    # 7. Static Code Analysis (SAST)
    - name: Run Bandit (SAST)
      run: |
        bandit -r . -x ./venv || true

    # 8. Dependency Vulnerability Scan (Non-blocking)
    - name: Run Safety Scan
      run: |
        safety scan --exit-code 0

    # 9. Code Quality Check
    - name: Run Flake8
      run: |
        flake8 . || true
