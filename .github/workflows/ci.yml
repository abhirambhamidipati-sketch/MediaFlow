name: Django DevSecOps CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-secure:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Setup Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Run Django migrations
    - name: Run migrations
      run: |
        python manage.py makemigrations
        python manage.py migrate

    # 5. Run Django tests
    - name: Run tests
      run: |
        python manage.py test

    # =========================
    # 🔐 DEVSECOPS PART STARTS
    # =========================

    # 6. Install security tools
    - name: Install security tools
      run: |
        pip install bandit safety

    # 7. Static Code Security Scan (SAST)
    - name: Run Bandit (SAST)
      run: |
        bandit -r . -x ./venv

    # 8. Dependency Vulnerability Scan
    - name: Run Safety (Dependency Check)
      run: |
        safety check --full-report

    # 9. Linting (Code Quality + Security Hygiene)
    - name: Run Flake8
      run: |
        pip install flake8
        flake8 .

    # =========================
    # OPTIONAL: Fail if issues found
    # =========================
