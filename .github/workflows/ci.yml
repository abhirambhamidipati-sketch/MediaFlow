name: Django CI/CD (Production Grade)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-test-secure-deploy:
    runs-on: ubuntu-latest

    steps:
    # -------------------------
    # 1. Checkout
    # -------------------------
    - name: Checkout code
      uses: actions/checkout@v4

    # -------------------------
    # 2. Setup Python
    # -------------------------
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # -------------------------
    # 3. Install dependencies
    # -------------------------
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # -------------------------
    # 4. Environment setup
    # -------------------------
    - name: Set environment variables
      run: |
        echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> $GITHUB_ENV

    # -------------------------
    # 5. Run migrations
    # -------------------------
    - name: Run migrations
      run: |
        python manage.py makemigrations
        python manage.py migrate

    # -------------------------
    # 6. Run tests
    # -------------------------
    - name: Run tests
      run: |
        python manage.py test

    # -------------------------
    # 7. Security checks
    # -------------------------
    - name: Install security tools
      run: |
        pip install bandit safety flake8

    - name: Run Bandit (SAST)
      run: |
        bandit -r . -x ./venv

    - name: Run Safety (Dependencies)
      run: |
        safety check --full-report

    - name: Run Flake8 (Lint)
      run: |
        flake8 .

    # -------------------------
    # 8. Collect static (optional but good practice)
    # -------------------------
    - name: Collect static files
      run: |
        python manage.py collectstatic --noinput

    # -------------------------
    # 9. Deploy to Azure (CD)
    # -------------------------
    - name: Deploy to Azure App Service
      if: github.ref == 'refs/heads/develop' && success()
      uses: azure/webapps-deploy@v2
      with:
        app-name: mediaflow-backend-abhiram
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .
